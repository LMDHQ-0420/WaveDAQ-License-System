name = "wavedaq-license-worker"
main = "src/index.ts"
compatibility_date = "2026-08-19"

[[d1_databases]]
binding = "DB"
database_name = "wavedaq-license"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
