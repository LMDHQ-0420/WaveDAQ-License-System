name: Build Launcher and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r launcher/requirements.txt pyinstaller
      - name: Build Launcher
        working-directory: launcher
        run: pyinstaller Launcher.spec
      - name: Create macOS DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "WaveDAQ Launcher" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "WaveDAQ-Launcher.app" 175 190 \
            --hide-extension "WaveDAQ-Launcher.app" \
            --app-drop-link 425 190 \
            "WaveDAQ-Launcher-macos-arm64-${GITHUB_REF_NAME}.dmg" \
            "launcher/dist/WaveDAQ-Launcher.app"
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-macos-arm64
          path: WaveDAQ-Launcher-macos-arm64-${{ github.ref_name }}.dmg
          if-no-files-found: error

  build-mac-x64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r launcher/requirements.txt pyinstaller
      - name: Build Launcher
        working-directory: launcher
        run: pyinstaller Launcher.spec
      - name: Create macOS DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "WaveDAQ Launcher" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "WaveDAQ-Launcher.app" 175 190 \
            --hide-extension "WaveDAQ-Launcher.app" \
            --app-drop-link 425 190 \
            "WaveDAQ-Launcher-macos-x64-${GITHUB_REF_NAME}.dmg" \
            "launcher/dist/WaveDAQ-Launcher.app"
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-macos-x64
          path: WaveDAQ-Launcher-macos-x64-${{ github.ref_name }}.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r launcher/requirements.txt pyinstaller
      - name: Build Launcher
        working-directory: launcher
        run: pyinstaller Launcher.spec
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: iscc launcher/installer/WaveDAQ-Launcher.iss /DReleaseTag="${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-windows-x64
          path: WaveDAQ-Launcher-windows-x64-${{ github.ref_name }}-setup.exe
          if-no-files-found: error

  publish-release:
    needs: [build-mac-arm64, build-mac-x64, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: WaveDAQ Launcher ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/*
